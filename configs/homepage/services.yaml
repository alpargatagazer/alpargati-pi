- Applications:
    - Vaultwarden:
        icon: vaultwarden-light
        href: https://vault.{{DOMAIN}}
        description: Secure Password Manager
        server: rpi-docker
        container: vaultwarden

    - FreshRSS:
        icon: freshrss
        href: http://rss.{{DOMAIN}}
        description: RSS reader
        server: rpi-docker
        container: freshrss
        widget:
            type: freshrss
            url: http://rss:80

    - SilverBullet:
        icon: silverbullet
        href: http://notes.{{DOMAIN}}
        description: Extensible personal knowledge base
        server: rpi-docker
        container: silverbullet

    - Memos:
        icon: memos
        href: http://memos.{{DOMAIN}}
        description: Lightweight note-taking
        server: rpi-docker
        container: memos

- Infrastructure:
    - Syncthing:
        icon: syncthing
        href: http://sync.{{DOMAIN}}
        description: Continuous File Synchronization
        server: rpi-docker
        container: syncthing

    - Dozzle:
        icon: dozzle
        href: http://logs.{{DOMAIN}}
        description: Real-time Docker logs viewer
        server: rpi-docker
        container: dozzle

    - What's up Docker?:
        icon: whats-up-docker
        href: http://wud.{{DOMAIN}}
        description: Container update monitoring
        server: rpi-docker
        container: wud
        widget:
            type: whatsupdocker
            url: http://wud:2999
            username: {{WUD_ADMIN_USER}}
            password: {{WUD_ADMIN_PASSWORD_HASH}}

- Network:
    - AdGuard Home:
        icon: adguard-home
        href: http://adguard.{{DOMAIN}}
        description: Network-wide ads & trackers blocking
        server: rpi-docker
        container: adguardhome
        widget:
            type: adguard
            url: http://host.docker.internal:3000
            username: {{ADGUARD_ADMIN_USER}}
            password: {{ADGUARD_ADMIN_PASSWORD}}

    - Tailscale:
        icon: tailscale
        href: https://login.tailscale.com/admin/machines
        description: Secure VPN access
        server: rpi-docker
        container: tailscale
        widget:
            type: tailscale
            deviceid: alpargati-pi
            key: {{TS_API_KEY}}
