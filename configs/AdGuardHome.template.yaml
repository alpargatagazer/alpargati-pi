whitelist_filters: []
user_rules:
  - '@@||sts.amazonaws.com^'
  - '@@||headspace.com^'
  - '@@||agoragranada.provis.es^'
dhcp:
  enabled: false
  interface_name: ""
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_services:
    schedule:
      time_zone: {{TZ}}
    ids: []
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: true
    duckduckgo: true
    ecosia: true
    google: true
    pixabay: true
    yandex: true
    youtube: true
  blocking_mode: default
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  rewrites:
    - domain: {{DOMAIN}}
      answer: {{ETH0_IP}}
      enabled: true
    - domain: '*.{{DOMAIN}}'
      answer: {{ETH0_IP}}
      enabled: true
  safe_fs_patterns:
    - /opt/adguardhome/work/userfilters/*
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  rewrites_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent:
    - name: Alpargatipi
      ids:
        - {{ETH0_IP}}
      tags:
        - device_other
        - os_linux
      use_global_settings: true
      filtering_enabled: false
    - name: Windows
      ids:
        - 192.168.0.135
      tags:
        - device_laptop
        - os_windows
      use_global_settings: true
      filtering_enabled: false
    - name: PS5
      ids:
        - 192.168.0.129
      tags:
        - device_gameconsole
      use_global_settings: true
      filtering_enabled: false
    - name: TV
      ids:
        - 192.168.0.132
      tags:
        - device_tv
        - os_android
      use_global_settings: true
      filtering_enabled: false
    - name: iPhone P2
      ids:
        - 192.168.0.134
      tags:
        - device_phone
        - os_ios
      use_global_settings: true
      filtering_enabled: false
    - name: iPhone P1
      ids:
        - 192.168.0.131
      tags:
        - device_phone
        - os_ios
      use_global_settings: true
      filtering_enabled: false
    - name: iPhone P1 (Tailscale)
      ids:
        - 100.127.16.67
      tags:
        - device_phone
        - os_ios
      use_global_settings: true
      filtering_enabled: false
    - name: macOS P2
      ids:
        - 192.168.0.136
      tags:
        - device_laptop
        - os_macos
      use_global_settings: true
      filtering_enabled: false
    - name: macOS P1
      ids:
        - 192.168.0.139
      tags:
        - device_laptop
        - os_macos
      use_global_settings: true
      filtering_enabled: false
    - name: macOS P2
      ids:
        - 192.168.0.137
      tags:
        - device_laptop
        - os_macos
      use_global_settings: true
      filtering_enabled: false
log:
