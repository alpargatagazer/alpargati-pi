services:

  # One-shot container to fix volume permissions for the host user
  init-chown:
    image: busybox:latest
    container_name: init-chown
    user: root
    command: >
      sh -c "chown -R ${PUID}:${PGID} /data /volumes && chmod -R 775 /data /volumes"
    volumes:
      - ${DATA_PATH}:/data
      - ${VOLUMES_PATH}:/volumes
    restart: "no"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN},home.${DOMAIN}
    user: "${PUID}:${PGID}"
    depends_on:
      - init-chown
    volumes:
      - ./configs/homepage/rendered:/app/config
      # Optional: Docker socket for widget integration
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "-O", "-", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    profiles: [ "tailscale" ]
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=alpargati-pi
      - TS_USERSPACE=false
    volumes:
      - ${VOLUMES_PATH}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: host
    restart: unless-stopped

networks:
  frontend:
    name: alpargati-pi_frontend
