services:

  # One-shot container to fix volume permissions for the host user
  init-chown:
    image: alpine:latest
    container_name: init-chown
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    # run as root (default) and perform a safe chown only when /volumes and /music exists
    command: >
      sh -euxc '
        if [ -d /volumes ]; then
          echo "Init: fixing ownership of /volumes to ${PUID:-1000}:${PGID:-1000}";
          chown -R ${PUID:-1000}:${PGID:-1000} /volumes || true;
        else
          echo "Init: /volumes not found, skipping";
        fi
        if [ -d /data ]; then
          echo "Init: fixing ownership of /data to ${PUID:-1000}:${PGID:-1000}";
          chown -R ${PUID:-1000}:${PGID:-1000} /data || true;
        else
          echo "Init: /data not found, skipping";
        fi
      '
    volumes:
      - ${VOLUMES_PATH}:/volumes:rw
      - ${DATA_PATH}:/data:rw
    restart: "no"

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.9.0
    container_name: homepage
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN},home.${DOMAIN}
    user: "${PUID}:${PGID}"
    depends_on:
      - init-chown
    volumes:
      - ./configs/homepage/rendered:/app/config
      # Optional: Docker socket for widget integration
      - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock:ro
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "-O", "-", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  tailscale:
    image: tailscale/tailscale:v1.92.5
    container_name: tailscale
    profiles: [ "tailscale" ]
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=alpargati-pi
      - TS_USERSPACE=false
      - TS_ROUTES=192.168.0.0/24
      - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - ${VOLUMES_PATH}/tailscale/data:/var/lib/tailscale
      - ${VOLUMES_PATH}/tailscale/run:/tmp
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: host
    restart: unless-stopped

networks:
  frontend:
    name: alpargati-pi_frontend
