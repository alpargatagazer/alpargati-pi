services:

  adguardhome:
    image: adguard/adguardhome:v0.107.71
    container_name: adguardhome
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${VOLUMES_PATH}/adguardhome/conf:/opt/adguardhome/conf
    network_mode: host
    depends_on:
      - init-chown
    restart: unless-stopped
    # cap_add required for binding to privileged ports
    cap_add:
      - NET_ADMIN

  vaultwarden:
    image: vaultwarden/server:1.35.2
    container_name: vaultwarden
    user: "${PUID}:${PGID}"
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    environment:
      TZ: ${TZ}
      # Read admin token from secret file
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      # Security settings
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"
      # Websocket for live sync
      WEBSOCKET_ENABLED: "true"
    secrets:
      - vaultwarden_admin_token
    volumes:
      - ${VOLUMES_PATH}/vaultwarden:/data
    networks:
      - frontend
    depends_on:
      - init-chown
    restart: unless-stopped

  silverbullet:
    image: zefhemel/silverbullet:2.4.1
    container_name: silverbullet
    user: "${PUID}:${PGID}"
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/silverbullet:/space
    networks:
      - frontend
    depends_on:
      - init-chown
    restart: unless-stopped

  memos:
    image: neosmemo/memos:0.25.3
    container_name: memos
    user: "${PUID}:${PGID}"
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/memos:/var/opt/memos
    networks:
      - frontend
    depends_on:
      - init-chown
    restart: unless-stopped

secrets:
  vaultwarden_admin_token:
    file: ${SECRETS_PATH}/vaultwarden_admin_token

networks:
  frontend:
    name: alpargati-pi_frontend
