services:

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
      # Read admin token from secret file
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      # Security settings
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"
      # Websocket for live sync
      WEBSOCKET_ENABLED: "true"
    secrets:
      - vaultwarden_admin_token
    volumes:
      - ${VOLUMES_PATH}/vaultwarden:/data
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/usr/bin/wget --spider --quiet http://localhost:80/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${VOLUMES_PATH}/adguardhome/conf:/opt/adguardhome/conf
    ports:
      # DNS ports - must be exposed to the host for network DNS
      - "53:53/tcp"
      - "53:53/udp"
      # Setup wizard and dashboard
      - "3000:3000/tcp"
      # DNS-over-TLS (DoT) and DNS-over-QUIC (DoQ)
      - "853:853/tcp"
      - "853:853/udp"
      - "784:784/udp"
      - "8853:8853/udp"
      # DNSCrypt
      - "5443:5443/tcp"
      - "5443:5443/udp"
      # DHCP (optional, uncomment if needed)
      # - "67:67/udp"
      # - "68:68/udp"
    networks:
      - frontend
    restart: unless-stopped
    # cap_add required for binding to privileged ports
    cap_add:
      - NET_ADMIN

  silverbullet:
    image: zefhemel/silverbullet:latest
    container_name: silverbullet
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/silverbullet:/space
    networks:
      - frontend
    restart: unless-stopped

  memos:
    image: neosmemo/memos:stable
    container_name: memos
    labels:
      - 'wud.tag.include=stable'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/memos:/var/opt/memos
    networks:
      - frontend
    restart: unless-stopped

secrets:
  vaultwarden_admin_token:
    file: ${SECRETS_PATH}/vaultwarden_admin_token

networks:
  frontend:
    name: alpargati-pi_frontend
