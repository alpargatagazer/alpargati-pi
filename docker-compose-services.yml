services:

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
      # Read admin token from secret file
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      # Security settings
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"
      # Websocket for live sync
      WEBSOCKET_ENABLED: "true"
    secrets:
      - vaultwarden_admin_token
    volumes:
      - ${VOLUMES_PATH}/vaultwarden:/data
    networks:
      - frontend
    user: "${PUID}:${PGID}"
    depends_on:
      - init-chown
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/usr/bin/wget --spider --quiet http://localhost:80/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${VOLUMES_PATH}/adguardhome/conf:/opt/adguardhome/conf
    network_mode: host
    depends_on:
      - init-chown
    restart: unless-stopped
    # cap_add required for binding to privileged ports
    cap_add:
      - NET_ADMIN

  silverbullet:
    image: zefhemel/silverbullet:latest
    container_name: silverbullet
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/silverbullet:/space
    networks:
      - frontend
    user: "${PUID}:${PGID}"
    depends_on:
      - init-chown
    restart: unless-stopped

  memos:
    image: neosmemo/memos:stable
    container_name: memos
    labels:
      - 'wud.tag.include=stable'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
    volumes:
      - ${VOLUMES_PATH}/memos:/var/opt/memos
    networks:
      - frontend
    user: "${PUID}:${PGID}"
    depends_on:
      - init-chown
    restart: unless-stopped

secrets:
  vaultwarden_admin_token:
    file: ${SECRETS_PATH}/vaultwarden_admin_token

networks:
  frontend:
    name: alpargati-pi_frontend
