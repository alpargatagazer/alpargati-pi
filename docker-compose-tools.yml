services:

  filebrowser:
    image: filebrowser/filebrowser:v2
    profiles: [ "filebrowser" ]
    container_name: filebrowser
    labels:
      - 'wud.tag.include=^v\d+$$'
      - 'wud.watch.digest=true'
    entrypoint: [ "${CONTAINER_ENTRYPOINT_PATH:-/entrypoint.sh}" ]
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      FILEBROWSER_ADMIN_USER: ${FILEBROWSER_ADMIN_USER}
      # FILEBROWSER_ADMIN_PASSWORD is injected by entrypoint from secret
    secrets:
      - filebrowser_admin_password
    volumes:
      - ${VOLUMES_PATH}/filebrowser/database:/database:rw
      - ${DATA_PATH:-/tmp/fake_data}:/srv:rw
      - ./configs/entrypoints/filebrowser.sh:${CONTAINER_ENTRYPOINT_PATH:-/entrypoint.sh}:ro
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "-O", "-", "http://127.0.0.1:8080/" ]
      interval: 1m
      timeout: 10s
      retries: 3

  dozzle:
    image: amir20/dozzle:latest
    profiles: [ "dozzle" ]
    container_name: dozzle
    labels:
      - 'wud.tag.include=latest'
      - 'wud.watch.digest=true'
    environment:
      TZ: ${TZ}
      DOZZLE_NO_ANALYTICS: "true"
      # Dozzle uses /var/run/docker.sock by default
    volumes:
      - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock:ro
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/dozzle", "healthcheck" ]
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s

  wud:
    image: getwud/wud:main
    profiles: [ "wud" ]
    container_name: wud
    entrypoint: [ "${CONTAINER_ENTRYPOINT_PATH:-/entrypoint.sh}" ]
    labels:
      wud.watch: "false"
    environment:
      TZ: ${TZ}
      WUD_SERVER_PORT: 2999
      WUD_WATCHER_LOCAL_CRON: "0 6 * * *"
      WUD_AUTH_BASIC_ADMIN_USER: ${WUD_ADMIN_USER}
      # WUD_AUTH_BASIC_ADMIN_HASH is injected by entrypoint from secret
      # Compose triggers
      WUD_TRIGGER_DOCKERCOMPOSE_CORE_FILE: /wud/docker-compose-core.yml
      WUD_TRIGGER_DOCKERCOMPOSE_CORE_PRUNE: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_CORE_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_NETWORK_FILE: /wud/docker-compose-network.yml
      WUD_TRIGGER_DOCKERCOMPOSE_NETWORK_PRUNE: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_NETWORK_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_SERVICES_FILE: /wud/docker-compose-services.yml
      WUD_TRIGGER_DOCKERCOMPOSE_SERVICES_PRUNE: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_SERVICES_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_TOOLS_FILE: /wud/docker-compose-tools.yml
      WUD_TRIGGER_DOCKERCOMPOSE_TOOLS_PRUNE: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_TOOLS_AUTO: "false"
    secrets:
      - wud_admin_password_hash
    volumes:
      - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock
      - ./docker-compose-core.yml:/wud/docker-compose-core.yml:ro
      - ./docker-compose-network.yml:/wud/docker-compose-network.yml:ro
      - ./docker-compose-services.yml:/wud/docker-compose-services.yml:ro
      - ./docker-compose-tools.yml:/wud/docker-compose-tools.yml:ro
      - ./configs/entrypoints/wud.sh:${CONTAINER_ENTRYPOINT_PATH:-/entrypoint.sh}:ro
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://127.0.0.1:2999/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 3

secrets:
  filebrowser_admin_password:
    file: ${SECRETS_PATH}/filebrowser_admin_password
  wud_admin_password_hash:
    file: ${SECRETS_PATH}/wud_admin_password_hash

networks:
  frontend:
    name: alpargati-pi_frontend
